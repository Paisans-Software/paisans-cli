# Rendered by paisans. Do not edit: `paisans apply` overwrites this file.
#
# Every clustered application on this site connects to this HAProxy at
# 10.44.0.2:5000, this site's own mesh address, from the first
# install. This backend list starts with one entry and grows when a site is
# added. No application configuration changes, ever: that one indirection is
# what makes a second site an operation rather than a project.
#
# The mesh address, not only loopback, because the applications run in bridge
# networked containers, where 127.0.0.1 is the container itself. Loopback is
# kept for a tool run on the host.
global
    maxconn 500

defaults
    log     global
    mode    tcp
    retries 2
    timeout client  30m
    timeout connect 4s
    timeout server  30m
    timeout check   5s

listen postgres
    bind 127.0.0.1:5000
    bind 10.44.0.2:5000
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server home-a 10.44.0.1:5432 maxconn 100 check port 8008
    server home-b 10.44.0.2:5432 maxconn 100 check port 8008

# Pocket ID's API, for a service on this site that calls it with the static
# API key, which then travels only over the mesh. Every site that runs Pocket
# ID is a server, and only the active instance answers /healthz, since a
# standby refuses connections on its port, so a takeover moves this route
# within three failed checks with no change here.
listen pocket-id
    bind 10.44.0.2:1413
    option httpchk GET /healthz
    http-check expect status 204
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server home-a 10.44.0.1:1411 check
    server home-b 10.44.0.2:1411 check

# Which backend HAProxy routes to, as CSV at /stats;csv, for `paisans site
# add` to check that only the primary is UP. Loopback only, and this is
# HAProxy's host network, so nothing off the machine can read it.
listen stats
    mode http
    bind 127.0.0.1:8404
    stats enable
    stats uri /stats
