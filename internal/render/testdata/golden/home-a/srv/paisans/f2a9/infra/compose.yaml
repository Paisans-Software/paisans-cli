# Rendered by paisans. Do not edit: `paisans deployment apply` overwrites this file.
#
# Infrastructure for site home-a. Bind mounts under /srv/paisans/f2a9/infra, never named
# volumes, so relocating a stack is a tar rather than a volumes-from dance.
name: paisans-f2a9-infra

services:
  etcd:
    labels:
      community.paisans.deployment: "f2a9c4e1-0b7d-4c3a-9e2f-5a6b7c8d9e01"
    image: "gcr.io/etcd-development/etcd:v3.5.*"
    restart: unless-stopped
    network_mode: host
    command:
      - /usr/local/bin/etcd
      - --name=home-a
      - --data-dir=/var/lib/etcd
      - --listen-peer-urls=http://10.44.0.1:2380
      - --listen-client-urls=http://10.44.0.1:2379
      - --initial-advertise-peer-urls=http://10.44.0.1:2380
      - --advertise-client-urls=http://10.44.0.1:2379
      - --initial-cluster=home-a=http://10.44.0.1:2380,home-b=http://10.44.0.2:2380,vm=http://10.44.0.3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=paisans
      # Measured from real round trip through the tunnel, not guessed. The
      # defaults assume one datacenter and produce phantom elections every
      # time a home connection hiccups.
      - --heartbeat-interval=200
      - --election-timeout=2000
      - --auto-compaction-mode=periodic
      - --auto-compaction-retention=1h
      - --quota-backend-bytes=2147483648
    volumes:
      - /srv/paisans/f2a9/infra/etcd:/var/lib/etcd
  patroni:
    labels:
      community.paisans.deployment: "f2a9c4e1-0b7d-4c3a-9e2f-5a6b7c8d9e01"
    image: "ghcr.io/zalando/spilo-18:4.1-p*"
    restart: unless-stopped
    # A Patroni that leads disarms the watchdog when its Postgres reaches the
    # shutdown's safepoint, once the clients are gone; one Docker kills before
    # then, at its default 10 s, leaves it armed and the host reboots. The
    # rest of the 60 s lets the shutdown finish and hand the leader key over.
    # It stays under the 120 s systemd gives user@.service to stop, and a stop
    # that ends sooner returns sooner.
    stop_grace_period: 60s
    network_mode: host
    env_file:
      - patroni.env
    volumes:
      - /srv/paisans/f2a9/infra/postgres:/home/postgres/pgdata
    # Fencing needs the watchdog, and there is exactly one Patroni per data
    # bearing host, so there is exactly one claimant for the device.
    devices:
      - /dev/watchdog:/dev/watchdog
    # Spilo starts Patroni as postgres through chpst, which keeps only the
    # primary group, so a root owned 0600 node is unusable and Patroni in
    # required mode never takes the leader. Docker makes the container its own
    # device node, so owning that copy changes nothing on the host. The image's
    # own CMD follows unchanged. Widening the host's node instead (a udev
    # rule) was tried first and rejected: chpst drops the group it relied on,
    # and any mode wide enough would let every local user arm the timer.
    command: ["/bin/sh", "-c", "chown postgres /dev/watchdog && exec /bin/sh /launch.sh init"]
  haproxy:
    labels:
      community.paisans.deployment: "f2a9c4e1-0b7d-4c3a-9e2f-5a6b7c8d9e01"
    image: "docker.io/library/haproxy:3.0.*-alpine"
    restart: unless-stopped
    network_mode: host
    volumes:
      - /srv/paisans/f2a9/infra/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
  garage:
    labels:
      community.paisans.deployment: "f2a9c4e1-0b7d-4c3a-9e2f-5a6b7c8d9e01"
    image: "docker.io/dxflrs/garage:v1.*.*"
    restart: unless-stopped
    network_mode: host
    volumes:
      - /srv/paisans/f2a9/infra/garage/garage.toml:/etc/garage.toml:ro
      - /srv/paisans/f2a9/infra/garage/meta:/var/lib/garage/meta
      - /srv/paisans/f2a9/infra/garage/data:/var/lib/garage/data
  # This site's heartbeat: a push a minute to every monitor off this site, at
  # its public hostname over the internet rather than the mesh, so that the
  # ping over the mesh and this push fail separately and the monitor can tell
  # a torn tunnel from a dead site. The URLs carry the site's token and stay
  # in heartbeat.env, which is 0600; this file is 0644. On the default bridge,
  # not the host's network: it dials out and listens for nothing.
  heartbeat:
    labels:
      community.paisans.deployment: "f2a9c4e1-0b7d-4c3a-9e2f-5a6b7c8d9e01"
    image: "docker.io/curlimages/curl:8.*.*"
    restart: unless-stopped
    env_file:
      - heartbeat/heartbeat.env
    entrypoint: ["/bin/sh", "/push.sh"]
    volumes:
      - /srv/paisans/f2a9/infra/heartbeat/push.sh:/push.sh:ro
  # This site's Beszel agent, which dials the hub with this site's token and
  # reports the host and its containers. On the host's network, like the rest
  # of this stack, so the figures are the host's. The socket is the
  # deployment user's rootless Docker, whose path apply learns over ssh and
  # exports as PAISANS_DOCKER_SOCKET; compose run any other way fails by name
  # rather than mounting nothing. Read only on the mount does not limit the
  # API behind it: the agent can do what the deployment user can, which
  # already owns every container here.
  #
  # The data directory keeps the fingerprint the hub pins on the agent's
  # first connection (internal/hub/agent_connect.go handleSingleRecord at
  # Beszel v0.21.1; agent/fingerprint.go), so a recreated container, or a
  # renamed host, still reads as the same agent rather than a fingerprint
  # mismatch.
  beszel-agent:
    labels:
      community.paisans.deployment: "f2a9c4e1-0b7d-4c3a-9e2f-5a6b7c8d9e01"
    image: "ghcr.io/henrygd/beszel/beszel-agent:0.21.*"
    restart: unless-stopped
    network_mode: host
    env_file:
      - beszel-agent/beszel-agent.env
    volumes:
      - ${PAISANS_DOCKER_SOCKET:?run by paisans deployment apply}:/var/run/docker.sock:ro
      - /srv/paisans/f2a9/infra/beszel-agent/data:/var/lib/beszel-agent

# Every network carries the deployment label too, so that what owns it is
# read from the label rather than guessed from its name.
networks:
  default:
    labels:
      community.paisans.deployment: "f2a9c4e1-0b7d-4c3a-9e2f-5a6b7c8d9e01"
