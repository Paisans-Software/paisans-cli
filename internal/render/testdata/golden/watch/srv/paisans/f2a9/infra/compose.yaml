# Rendered by paisans. Do not edit: `paisans deployment apply` overwrites this file.
#
# Infrastructure for site watch. Bind mounts under /srv/paisans/f2a9/infra, never named
# volumes, so relocating a stack is a tar rather than a volumes-from dance.
name: paisans-f2a9-infra

services:
  caddy:
    labels:
      community.paisans.deployment: "f2a9c4e1-0b7d-4c3a-9e2f-5a6b7c8d9e01"
    image: "ghcr.io/paisans-software/caddy:2.*.*"
    restart: unless-stopped
    network_mode: host
    # Relative to this file, so the path names the caddy/ directory the token
    # is rendered into. The token stays out of this file because compose.yaml
    # is 0644 and readable by anything that can list the stack.
    env_file:
      - caddy/caddy.env
    volumes:
      # The Caddyfile, and in snippets/ one file per application, imported by
      # that application's host block. The directory, not the files: apply
      # renames a new file over the old one, which a reload only reads through
      # a directory mount.
      - /srv/paisans/f2a9/infra/caddy/etc:/etc/caddy:ro
      - /srv/paisans/f2a9/infra/caddy/data:/data
      - /srv/paisans/f2a9/infra/caddy/config:/config
  # This site's Beszel agent, which dials the hub with this site's token and
  # reports the host and its containers. On the host's network, like the rest
  # of this stack, so the figures are the host's. The socket is the
  # deployment user's rootless Docker, whose path apply learns over ssh and
  # exports as PAISANS_DOCKER_SOCKET; compose run any other way fails by name
  # rather than mounting nothing. Read only on the mount does not limit the
  # API behind it: the agent can do what the deployment user can, which
  # already owns every container here.
  #
  # The data directory holds the fingerprint the hub pins on the agent's
  # first connection (internal/hub/agent_connect.go handleSingleRecord at
  # Beszel v0.21.1; agent/fingerprint.go). The toolkit renders it there from
  # the deployment and the site, so a recreated container, a renamed host or
  # a host rebuilt under this site's name reads as the same agent rather
  # than a fingerprint mismatch.
  beszel-agent:
    labels:
      community.paisans.deployment: "f2a9c4e1-0b7d-4c3a-9e2f-5a6b7c8d9e01"
    image: "ghcr.io/henrygd/beszel/beszel-agent:0.21.*"
    restart: unless-stopped
    network_mode: host
    env_file:
      - beszel-agent/beszel-agent.env
    volumes:
      - ${PAISANS_DOCKER_SOCKET:?run by paisans deployment apply}:/var/run/docker.sock:ro
      - /srv/paisans/f2a9/infra/beszel-agent/data:/var/lib/beszel-agent

# Every network carries the deployment label too, so that what owns it is
# read from the label rather than guessed from its name.
networks:
  default:
    labels:
      community.paisans.deployment: "f2a9c4e1-0b7d-4c3a-9e2f-5a6b7c8d9e01"
