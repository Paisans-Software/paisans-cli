; Rendered by paisans. Do not edit.
;
; A build artifact: `paisans apply` renders it and refuses to overwrite one
; that has been modified locally. Change paisans-stack.yaml or secrets.enc.yaml.
;
; A changed file needs a restart at most, not a recreate: the container reads
; it at startup and keeps its identity.
;
; Every database setting this file sets, which the fork then reads from here
; on every start and never imports into its database: the admin page shows
; each one greyed out and refuses a change, and `writefreely settings set`
; refuses it too. paisans-stack.yaml stays their only source. A name the fork does
; not know, or a value it would refuse, stops it at startup rather than
; leaving a setting silently unlocked (docs/settings.md, "Locking settings in
; config.ini", at writefreely-wisp v0.21.1+wisp). A passthrough key under
; `config` is the operator's and is not locked.
;
; The file carries no settings_location marker, and the fork logs at each
; start that it could not add one to this read-only file. That is a warning
; only: the marker on a database that holds no settings yet stops startup, so
; the toolkit does not render it.
locked_settings = app.site_name, app.theme, app.open_registration, app.min_username_len, app.federation, app.public_stats, app.private, app.authorized_fetch, app.local_timeline, uploads.enabled, uploads.max_size_mb

[server]
hidden_host =
port = 8081
bind = 0.0.0.0
autocert = false

[database]
; Postgres, the same cluster everything else uses. A pinned blog talks to the
; Postgres container beside it; a clustered one talks to the local HAProxy,
; which is what .DBHost already resolves for every other blueprint.
;
; The fork maps tls = true to sslmode=require, which encrypts without
; checking the certificate, and false to sslmode=disable. A clustered blog
; needs true: the cluster's pg_hba.conf rejects every connection without TLS
; (hostnossl all all all reject), and the HAProxy .DBHost names may be on
; another site, so the connection can cross the mesh. A pinned blog talks to
; the Postgres container in its own Compose project, which serves no TLS, so
; it stays false there.
type = postgres
host = postgres
port = 5432
database = blog
username = blog
password = fixture-not-a-secret-blog-db
tls = false

[uploads]
; Image uploads are off in the fork unless this says otherwise, and the
; default is false. Without it POST /api/me/images is not routed at all, the
; /uploads/ route is gated off, and the [storage] block above is provisioned
; but never read: a bucket, a key and a grant that nothing uses.
;
; It also turns on the startup check. checkUploadsAtStartup is itself gated on
; uploads being enabled, so with uploads off a wrong bucket or a refused key is
; not reported at boot either, and the first signal an operator gets is a
; failed upload much later.
;
; dir is where the local image store writes, and /data/uploads is the
; directory the image creates for it (Dockerfile:78 at ff9dceb, the commit the
; pinned image is built from; config/config.go:237-240 names it as the place a
; packaged install wants). It is inside /data, which compose.yaml binds from
; data/ in this stack, so the images stay with the app when it moves. It is a
; bootstrap key, read from this file on every start rather than moved into the
; database (config/settings.go:91), as is all of [storage].
enabled = true
dir = /data/uploads
; A bound on one file, not on a writer's total storage. Rendered rather than
; omitted: an absent key leaves Go's zero value, which the fork's setting
; registry rejects and replaces with its default, logging an ERROR on every
; boot while doing it.
max_size_mb = 10

[storage]
; Uploaded images on this site's own disk (storage: local, or no Garage in the
; deployment), under [uploads] dir above. The fork serves them itself at
; /uploads/ on this app's own hostname (uploadsHandler, imagestore.go:364-386
; at ff9dceb), and with type local it needs no other key here
; (config/storage.go:34-37). Written rather than left out, so the choice is
; visible in the file.
type = local

[app]
site_name = blog
host = https://blog.example.org
theme = write
single_user = false
open_registration = false
; Rendered for the same reason as max_size_mb: the fork's registry rejects the
; zero an absent key leaves behind, and logs an ERROR on every boot.
min_username_len = 3
federation = true
public_stats = false
private = true
; A valid HTTP signature on every ActivityPub read and inbox delivery, public
; or private, from an allowlisted host when an allowlist is set. Discovery and
; the instance actor stay open, since a peer needs them before it can sign.
; On unless settings.authorized_fetch is false.
authorized_fetch = true
local_timeline = true
; Sign in is the identity provider's, so the local password path is closed.
disable_password_auth = true
; Set by `config` in paisans-stack.yaml, not by a template.
max_blogs = 3

[oauth.generic]
client_id = fixture-not-a-secret-blog-id
client_secret = fixture-not-a-secret-blog-secret
host = https://id.example.org
display_name = OpenID Connect
; Paths, not URLs: WriteFreely appends each to `host` above.
auth_endpoint = /authorize
token_endpoint = /api/oidc/token
inspect_endpoint = /api/oidc/userinfo
scope = openid profile email
map_user_id = sub
map_username = preferred_username
map_display_name = name
map_email = email
allow_disconnect = false
