# The engagement blueprint. A reserved blueprint: built into the binary with the Go that drives it, and never read from a catalog.
# internal/blueprints reads it; Parse there documents every key.
apiVersion: paisans.blueprint/v1
name: engagement
services:
  # paisans-engagement-service: the weekly digest email, which reads the
  # community's Mbin through a role that can only read
  # (docs/specs/2026-10-24-engagement-digest.md). Its own database holds
  # only unsubscribes and the record of each week's sends. Its image is the
  # core catalog's foundation.yaml's.
  - {name: "app", foundation: "engagement", purpose: "the weekly digest"}
  - {name: "postgres", purpose: "its role and database on the cluster"}
database: {engine: postgres}
# 8083: Mbin publishes 8080 and the account service 8082, and clustered apps
# share every apps site's mesh address, so each needs its own port. The
# service reads its port from ENGAGEMENT_LISTEN_ADDR, which this toolkit
# renders, and its image's health check probes the same variable.
port: 8083
config:
  format: env
  file: ".env"
# paisans-engagement-service's /healthz answers 200 when its database does.
health: {path: "/healthz", status: [200]}
# Gateable, and gated wherever the bot runs: the web digest, /d/<week>,
# names the member by the gate's X-Auth-Request-User, the Pocket ID subject,
# so the link carries no secret and no member's id, and members-only content
# never sits behind a bearer link. The unsubscribe links stay open: a member
# clicking one from an inbox may not be signed in, and the signed token in it
# is what names them. /healthz is open as the health route.
gate:
  gateable: true
  open_paths: ["/u/*"]
mail: reads
# The homeserver the Digest Bot runs on. Optional: with homeserver unset the
# app links to the deployment's one matrix-homeserver, and with none the bot
# is off. The MAS admin client's secret is shared with the homeserver app,
# whose mas.yaml declares the client beside this app's .env.
consumes:
  - {role: matrix-homeserver, setting: homeserver, optional: true, shared_secrets: [mas_admin_client_secret]}
settings:
  # The homeserver's hostname, unset meaning the deployment's one.
  homeserver: {type: string}
  # The bot's localpart. A setting because MAS takes members' localparts
  # from Pocket ID, so a member may already hold the default. Changing it
  # gives the bot a new account and abandons the old one's rooms.
  bot_localpart: {type: string, default: "community-bot"}
  # The name members see the bot by, which it sets on its account at start.
  bot_display_name: {type: string, default: "Community Bot"}
secrets:
  required:
    - {key: "digest_signing_key", why: "paisans-engagement-service refuses to start without ENGAGEMENT_SIGNING_KEY"}
  generate:
    # It signs every unsubscribe link the digest sends. A new key makes
    # every link in an email already sent stop working, and the next
    # digest carries links signed with it.
    - {name: digest_signing_key, format: password, rotation_cost: restart}
    # The password of the role that reads Mbin's database.
    - source_database_password
    # The secret of the MAS admin client the bot looks members up with. The
    # homeserver app's mas.yaml declares the client with it, beside this
    # app's .env, so a rotation re-renders and restarts both.
    - {name: mas_admin_client_secret, format: password, rotation_cost: restart}
  self_rotated: ["digest_signing_key", "mas_admin_client_secret"]
