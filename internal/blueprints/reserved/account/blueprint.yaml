# The account blueprint. A reserved blueprint: built into the binary with the Go that drives it, and never read from a catalog.
# internal/blueprints reads it; Parse there documents every key.
apiVersion: paisans.blueprint/v1
name: account
services:
  # paisans-account-service: the community's account management, which
  # carries member invites with the code of conduct before the account
  # (docs/specs/2026-10-14-account-service.md). Cluster placement only,
  # so the PostgresService row is the cluster's role and database, never
  # a container of its own. Its image is the core catalog's
  # foundation.yaml's.
  - {name: "app", foundation: "account", purpose: "the account service"}
  - {name: "postgres", purpose: "its role and database on the cluster"}
database: {engine: postgres}
# Not the service's default 8080: Mbin publishes 8080, and both are
# clustered, so they share every apps site's mesh address. The service
# reads its port from ACCOUNT_LISTEN_ADDR, which this toolkit renders, and
# its image's health check probes the same variable.
port: 8082
config:
  format: env
  file: ".env"
# paisans-account-service's /healthz answers 200 when its database does.
health: {path: "/healthz", status: [200]}
# Invitees reach /i/* on the invite hostname before they have an
# account; a member gate would lock them out.
gate: {gateable: false}
# invite.<domain>, or hostnames.invite, serves the pages an invitee opens
# before they have an account, and exists only with settings.invites true
# (blueprints.InviteHostname). Everything a signed in member or admin uses
# stays on the primary hostname.
hostname_roles: ["invite"]
mail: reads
# paisans-account-service's callback is GET /auth/callback with PKCE S256
# (internal/web/auth.go); it reads the groups claim to tell members
# from admins.
oidc:
  callback: "/auth/callback"
  pkce: true
  member_group_setting: "member_group"
  admin_group_setting: "admin_group"
  default_member_group: "members"
  default_admin_group: "admins"
  reads_groups: true
secrets:
  required:
    - {key: "email_hash_key", why: "paisans-account-service refuses to start without ACCOUNT_EMAIL_HASH_KEY"}
    - {key: "session_key", why: "paisans-account-service refuses to start without ACCOUNT_SESSION_KEY"}
  # email_hash_key keys the hash of a declined address; session_key signs
  # the sign-in cookie (docs/specs/2026-10-12-invite-service.md).
  generate:
    # The service stores only the keyed hash of a declined address, so a new
    # key forgets every one.
    - {name: email_hash_key, never_rotate: "rotating it forgets every declined address"}
    # It signs the service's sign-in cookie, and nothing else.
    - {name: session_key, rotation_cost: signs-out}
  self_rotated: ["session_key"]
