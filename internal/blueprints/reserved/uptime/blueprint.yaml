# The uptime blueprint. A reserved blueprint: built into the binary with the Go that drives it, and never read from a catalog.
# internal/blueprints reads it; Parse there documents every key.
apiVersion: paisans.blueprint/v1
name: uptime
services:
  # The Paisans-Software/uptime fork: OIDC sign in gated on a group, a
  # seed file (SEED_FILE), TRUST_PROXY, an entrypoint that drops from
  # root, and a seed entry's heartbeat_token taken as the monitor's
  # token, which the per site heartbeat in internal/render/heartbeat.go
  # depends on. Its database is SQLite under /data, which is why the
  # blueprint is pinned only: it has no Postgres service, so
  # cluster-placement-without-a-cluster refuses it. Its image is the
  # core catalog's foundation.yaml's.
  - {name: "app", foundation: "uptime", purpose: "the monitor"}
database: {engine: sqlite}
# Not the fork's default 3000: Wiki.js publishes 3000, and two apps on
# one site publish on the same mesh address.
port: 3001
config:
  format: env
  file: ".env"
# src/server.js:63 at 1.1.0-oidc.1. Used for one monitor's public check of
# another on a separate site; a monitor does not watch itself
# (internal/render/uptime.go).
health: {path: "/healthz", status: [200]}
# The monitor is what an admin opens when the sites it watches are down.
# The gate signs in at the identity provider on those sites, so a gated
# monitor is unreadable at exactly the moment it exists for, and its
# break glass password sign-in (README, "Sign in", under the uptime
# blueprint) would sit behind the sign-in it is the fallback for. Its own
# OIDC client admits only settings.admin_group, so the gate would add no
# access control, only a dependency.
gate: {gateable: false}
storage:
  local_only: true
  local_only_reason: the monitor keeps everything, its SQLite database included, under /data
mail: reads
# The Paisans-Software/uptime fork at 1.1.0-oidc.2: the callback is
# /login/oidc/callback (src/lib/oidc.js:26), and every sign in sends
# an S256 code challenge (src/lib/oidc.js:96-103), so PKCE is on. Its
# one group is settings.admin_group, used as both: its members are
# the monitor's administrators, and nobody else may sign in, so the
# client is restricted to it and Pocket ID refuses everyone else
# before the monitor sees them. It has no default: validate requires
# it (uptime-needs-an-admin-group).
oidc:
  callback: "/login/oidc/callback"
  pkce: true
  admin_group_setting: "admin_group"
  member_group_setting: "admin_group"
  reads_groups: true
secrets:
  required:
    # src/config.js at 1.1.0-oidc.1: ADMIN_PASS falls back to "admin" and
    # SESSION_SECRET to a value invented per boot.
    - {key: "admin_password", why: "the monitor falls back to the password `admin` when ADMIN_PASS is unset"}
    - {key: "session_secret", why: "without it every restart signs every admin out"}
  # ADMIN_PASS is the break glass sign in for when the identity provider is
  # down, which is one of the things this app watches; the fork falls back
  # to the literal "admin" when it is unset, so it is generated rather than
  # optional. SESSION_SECRET signs the session cookie; unset, the fork
  # invents one per boot and every restart signs everyone out.
  generate:
    - admin_password
    # The fork passes it to express-session as `secret`, which signs the
    # uptime.sid cookie, and keeps sessions in memory, so the restart ends
    # them as well.
    - {name: session_secret, rotation_cost: signs-out}
  self_rotated: ["session_secret"]
