# The pocket-id blueprint. A reserved blueprint: built into the binary with the Go that drives it, and never read from a catalog.
# internal/blueprints reads it; Parse there documents every key.
apiVersion: paisans.blueprint/v1
name: pocket-id
services:
  - {name: "app", foundation: "pocket-id", purpose: "the application"}
  # Built from cmd/operator-reconciler by
  # .github/workflows/operator-reconciler-image.yml. The checks this toolkit
  # renders for need 0.3.0 or later, which the foundation's track names.
  - {name: "reconciler", foundation: "operator-reconciler", purpose: "the operator reconciler"}
  - {name: "postgres", purpose: "its own database, when the app is pinned"}
database: {engine: postgres}
port: 1411
config:
  format: env
  file: ".env"
  # FILE_BACKEND is owned by file_backend. Every setting in
  # blueprints.PocketIDSettings owns its variable as well, and the toolkit adds
  # those from that table rather than listing them again here, so a setting
  # added there is an owner without a second edit. signup_default_groups is
  # not among them: its variable carries recorded IDs, which the setting
  # chooses only by way of apply.
  setting_keys:
    - {key: "FILE_BACKEND", file: ".env", setting: "file_backend"}
# 204 No Content, not 200 (backend/internal/controller/
# healthz_controller.go:18,30-31 at v2.14.0); ran the image.
health: {path: "/healthz", status: [204]}
# The sign-in flow itself: gating it would gate the login.
gate: {gateable: false}
# Its whole application configuration is rendered (see
# PocketIDSettings), its mail settings among it.
mail: reads
secrets:
  required:
    # env_config.go:167-169 at tag v2.14.0.
    - {key: "encryption_key", why: "Pocket ID refuses to start without an ENCRYPTION_KEY of at least 16 bytes"}
    # Not needed to start, but without it the toolkit cannot create an
    # administrator or a client, and Pocket ID deletes the synthetic
    # user an earlier key created (apikey/service.go:31-36).
    - {key: "static_api_key", why: "it is the only credential `paisans app admin create`, `paisans oidc client create` and apply's client step can reach Pocket ID's API with"}
  # Pocket ID will not start without an ENCRYPTION_KEY of at least 16 bytes
  # (backend/internal/common/env_config.go:167-169 at tag v2.14.0). A
  # generated password is 32 random bytes, base64 encoded. It encrypts
  # stored secrets, so like every generated secret it is never replaced
  # once set.
  #
  # static_api_key is how this toolkit administers Pocket ID without a
  # browser: STATIC_API_KEY authenticates the X-API-Key header as a
  # synthetic administrator (apikey/service.go:156-163 and :221-259,
  # middleware/api_key_auth.go:38) and must be at least 16 characters
  # (env_config.go:182-184). README, "The toolkit administers Pocket ID
  # through its static API key", says why it is generated here.
  #
  # operators_heartbeat_token is what every instance of the app pushes the
  # operator reconciler's answer to each monitor with, and what each
  # monitor's seed names for the app (internal/render/operatorsheartbeat.go).
  # One per app rather than per site, so that the one monitor follows
  # whichever instance is active.
  generate:
    - name: encryption_key
      never_rotate: "it encrypts data already stored, so changing it makes that data unreadable, and Pocket ID offers no re-encryption the toolkit could drive. An evicted admin who held it also holds a copy of the data it protects, so rotating it would take nothing back"
    # Its users are the toolkit, the operator reconciler and the account
    # service, not members.
    - static_api_key
    # 16 random bytes, hex, the shape the uptime fork's seed takes a push
    # token in (src/lib/sitePayload.js insertSite at 1.1.0-oidc.4).
    - {name: operators_heartbeat_token, format: hex16}
    # The DNS continuity check's (internal/render/dnscontinuity.go): the key
    # every address is hashed under, so that no DNS provider address reaches
    # a host, and the tokens its two heartbeats push with, one per app as
    # the operators heartbeat's is. Generated whether or not the deployment
    # checks its DNS provider, so that adding the members token later needs
    # no init. The key is read only by this app's reconciler, which the
    # rendered .env restarts with it.
    - {name: dns_email_hash_key, format: hex32, rotation_cost: restart}
    - {name: dns_super_admins_heartbeat_token, format: hex16}
    - {name: dns_2fa_heartbeat_token, format: hex16}
  self_rotated: ["static_api_key", "dns_email_hash_key"]
