# The outline blueprint, in the core catalog.
# paisans-stack reads it; internal/kinds.Parse there documents every key.
apiVersion: paisans.blueprint/v1
name: outline
services:
  - {name: "app", image: "docker.io/outlinewiki/outline:1.*.*", purpose: "the application"}
  # Outline will not start without Redis: REDIS_URL is required, its
  # queues and collaboration run through it, and /_health pings it
  # (server/env.ts and server/main.ts at 65be53c). The same Valkey
  # track Mbin's cache runs.
  - {name: "valkey", image: "docker.io/valkey/valkey:9.*.*-trixie", purpose: "the queue and cache Outline requires"}
  - {name: "postgres", purpose: "its own database, when the app is pinned"}
database: {engine: postgres}
port: 3000
config:
  format: env
  file: ".env"
  setting_keys:
    - {key: "AWS_REGION", file: ".env", setting: "s3_region"}
    - {key: "AWS_S3_FORCE_PATH_STYLE", file: ".env", setting: "s3_force_path_style"}
    - {key: "AWS_S3_UPLOAD_BUCKET_NAME", file: ".env", setting: "s3_bucket"}
# Runs SELECT 1 and pings Redis, 500 when either fails
# (server/main.ts:78-105 at v1.10.0).
health: {path: "/_health", status: [200]}
# Cited at outline v1.10.0 (65be53c3).
gate:
  gateable: true
  open_paths:
    # OIDC: /auth/oidc, its /auth/oidc.callback, and /auth/redirect
    # (oidcRouter.ts:63,277-289, routes/auth/index.ts:35-36). Named
    # rather than /auth/*, which would open every other sign-in
    # provider's routes too (Eg: email sign-in, which sends mail to
    # any address it is given).
    - "/auth/oidc"
    - "/auth/oidc.callback"
    - "/auth/redirect"
    # What an OAuth client, an MCP client among them, needs before it
    # holds a token: discovery, registration and the token endpoint
    # (index.ts:116-170, oauth/index.ts:181-200). /oauth/authorize is
    # a browser navigation and stays behind the gate.
    - "/.well-known/oauth-authorization-server*"
    - "/.well-known/oauth-protected-resource*"
    - "/oauth/token"
    - "/oauth/register"
    - "/oauth/revoke"
  # An API key is created only from a signed-in session
  # (apiKeys.ts:23-27), and Outline's OAuth server issues tokens only
  # through authorization_code and refresh_token (OAuthInterface.ts:59).
  token_paths: ["/api/*", "/mcp"]
  # No auto-login: the sign-in screen redirects itself when OIDC is
  # the only provider (Login.tsx:79-93).
hostname_roles: ["media"]
storage:
  # Its bucket holds the attachments of documents that are readable only to
  # members, and its server presigns every read it issues, so its objects
  # are not public. It has no LocalMediaPaths either: its local store
  # answers through its own API with the reader's session or a signature it
  # issued, so there is nothing to open.
  s3: true
# outline v1.10.0: the callback is ${URL}/auth/${config.id}.callback
# with the provider id oidc (plugins/oidc/server/auth/oidcRouter.ts:63,
# registered at :249-253). PKCE is off because the toolkit renders the
# four explicit OIDC_*_URI values, and the manual configuration branch
# never passes pkce (plugins/oidc/server/auth/oidc.ts:27-35; only the
# OIDC_ISSUER_URL branch does, at :55). Outline reads no groups claim,
# so the restriction at Pocket ID is the whole control.
oidc:
  callback: "/auth/oidc.callback"
  pkce: false
  member_group_setting: "member_group"
  default_admin_group: "admins"
  default_member_group: "members"
secrets:
  # Outline refuses to start without SECRET_KEY, exactly 64 hex
  # characters, or without UTILS_SECRET (server/env.ts at 65be53c).
  # SECRET_KEY encrypts fields in the database, so replacing it makes
  # them unreadable: it is generated once and never rotated.
  # redis_password is Valkey's, named apart from Mbin's
  # valkey_password because a self rotated key belongs to one kind.
  generate:
    - name: outline_secret_key
      format: hex32
      never_rotate: "it encrypts data already stored, so changing it makes that data unreadable, and Outline offers no re-encryption the toolkit could drive. An evicted admin who held it also holds a copy of the data it protects, so rotating it would take nothing back"
    # UTILS_SECRET only authorizes Outline's own scheduled tasks, and Valkey
    # holds no session: Outline signs each with a per-user secret it keeps
    # in Postgres (server/models/User.ts, getJwtToken, at 65be53c).
    - {name: utils_secret, rotation_cost: restart}
    - {name: redis_password, rotation_cost: restart}
  required:
    - {key: "outline_secret_key", why: "Outline will not start without SECRET_KEY"}
    - {key: "utils_secret", why: "Outline will not start without UTILS_SECRET"}
    - {key: "redis_password", why: "Outline will not start without REDIS_URL, which carries it"}
  # Each is checked by the stack that presents it, so re-rendering
  # the stack is the whole rotation.
  self_rotated: ["redis_password", "utils_secret"]
# The rules validate holds an Outline app to, by the ids they have always
# had. Each message names the value an operator has to change.
checks:
  # A known Outline bug: upstream cannot use a bucket named outline, and it
  # fails after the deployment is up rather than at configuration time.
  - id: outline-bucket-named-outline
    level: refuse
    hint: outline bucket cannot be named outline
    key: settings.s3_bucket
    rule: |-
      app.storage.mode != 'object' || !has(app.settings.s3_bucket) || app.settings.s3_bucket != 'outline'
    message_expr: |-
      'is "outline". Upstream Outline cannot use a bucket of that name. Choose another, for example ' + app.name + '-uploads.'
  # Outline reads a bucket name anywhere in the bucket URL as virtual host
  # addressing and stops putting it in the path, while Garage needs it
  # there, because the media hostname is not under its S3 root domain. With
  # the default names it cannot happen: docs-uploads is not a substring of
  # https://docs-media.example.org. A bucket named docs, or media, is.
  - id: outline-bucket-in-media-url
    level: refuse
    hint: media URL contains the outline bucket name
    key: hostnames.media
    rule: |-
      !has(app.storage.media_hostname) || !('https://' + app.storage.media_hostname).contains(app.storage.bucket)
    message_expr: |-
      'makes the bucket URL https://' + app.storage.media_hostname + ', which contains the bucket name "' + app.storage.bucket + '". Outline reads a bucket name anywhere in that URL as virtual host addressing and stops putting the bucket in the path, while Garage needs it there, so every attachment upload would fail. Rename the bucket (settings.s3_bucket) or choose a media hostname that does not contain it.'
