# The synapse blueprint, in the core catalog.
# Paisans reads it; internal/blueprints.Parse in paisans-cli documents every key.
apiVersion: paisans.blueprint/v1
name: synapse
services:
  # Three containers, because a homeserver does not authenticate anyone
  # any more. Synapse is a resource server, Matrix Authentication
  # Service owns the login, and the identity provider is upstream of
  # MAS rather than of Synapse.
  #
  # NOTE THE MISSING `v`. Synapse tags as vX.Y.Z and MAS tags as X.Y.Z.
  # Both are tracks on their 1.x line, and a release candidate
  # (v1.161.0rc1, 1.25.0-rc.0) matches neither.
  - {name: "app", image: "ghcr.io/element-hq/synapse:v1.*.*", purpose: "the homeserver, which only serves the API"}
  # MAS listens on 18009, one above the homeserver's 18008. These ports
  # leave the data role's Patroni and bg_mon listeners on 8008/8009 free
  # when apps and data share a site. The gateway
  # reaches it directly: the three compatibility login paths are split off
  # to it in front of the homeserver. mas.yaml binds the port explicitly.
  - {name: "mas", image: "ghcr.io/element-hq/matrix-authentication-service:1.*.*", purpose: "Matrix Authentication Service, which owns the login", port: 18009}
  - {name: "postgres", purpose: "its own database, when the app is pinned"}
# MAS keeps its own database beside the homeserver's, <database>_mas, which
# initdb.d creates.
database: {engine: postgres, extra: [mas]}
# Element and any other Matrix client link to it by this role. base_url is
# where the client API is, the homeserver's primary hostname; server_name
# is the name inside every user identifier, its wellknown hostname when it
# delegates.
provides:
  - role: matrix-homeserver
    values:
      base_url: "'https://' + app.hostname"
      server_name: "'wellknown' in app.hostnames ? app.hostnames['wellknown'] : app.hostname"
port: 18008
config:
  # It also renders a `.env`, but only for its Postgres container's
  # password. The application reads the file below, so that is where a
  # passthrough key means anything.
  format: yaml
  file: "homeserver.yaml"
  # Synapse's header says the file "deliberately declares no identity
  # provider of its own and no local password database". These six are
  # Synapse's blocks for those: oidc_providers, oidc_config (its deprecated
  # single provider form), saml2_config, cas_config and jwt_config each
  # describe a way to register or log in, and password_config the local
  # password logins. Read in docs/usage/configuration/config_documentation.md
  # at tag v1.160.0, the version the blueprint pins, on 2026-10-04.
  omitted_keys:
    - {key: "cas_config", why: &identity "this homeserver is a resource server and Matrix Authentication Service owns every login, so an identity provider or a password database of its own would be a second way in that bypasses the group restriction at the identity provider"}
    - {key: "jwt_config", why: *identity}
    - {key: "oidc_config", why: *identity}
    - {key: "oidc_providers", why: *identity}
    - {key: "password_config", why: *identity}
    - {key: "saml2_config", why: *identity}
# Not /health, although Synapse has one (synapse/rest/health.py:38-50 at
# v1.160.0): the gateway sends only /_matrix/* and /_synapse/* to the
# homeserver and everything else to MAS, whose listener has no health
# resource, so the public check would ask the wrong service. The client
# versions endpoint answers without a token
# (synapse/rest/client/versions.py:40,50-60) on both routes.
health: {path: "/_matrix/client/versions", status: [200]}
# A Matrix client is not a browser and will not follow a redirect to a
# passkey prompt, and neither will a federating server.
gate: {gateable: false}
# A homeserver answers its API on the primary name and its delegation
# documents on whatever name appears in user identifiers, which is usually
# the apex. Routing them identically would publish the whole API on the
# apex as well.
hostname_roles: ["wellknown"]
storage:
  # Synapse's S3 storage provider supplements its media store rather than
  # replacing it, so a local media directory is always required. Its media
  # store is a directory the homeserver owns, which is also why the blueprint is
  # pinned to one node.
  local_only: true
  local_only_reason: "its S3 storage provider supplements the local media store rather than replacing it, so the media directory is always required"
# The relying party is the homeserver's authentication service, MAS
# at tag v1.24.0, so the callback is its upstream provider's, ending in
# the provider's ULID (crates/router/src/endpoints.rs:742-762). PKCE is on:
# mas.yaml sets pkce_method: always, the S256 mode
# (crates/config/src/sections/upstream_oauth2.rs:420-436,
# crates/cli/src/sync.rs:289-298), whose methods are S256 alone
# (crates/handlers/src/upstream_oauth2/cache.rs:137), so every sign
# in sends an S256 challenge
# (crates/oidc-client/src/requests/authorization_code.rs:242-256).
# mas.yaml requests no groups scope and imports no groups claim, so
# the restriction at Pocket ID is the whole control. No launch URL:
# the homeserver's hostname serves no page for a member, and a Matrix
# client is where they go.
oidc:
  callback: "/upstream/callback/{{ stableULID .App }}"
  no_launch: true
  pkce: true
  member_group_setting: "member_group"
  default_admin_group: "admins"
  default_member_group: "members"
secrets:
  # Three, because the homeserver no longer authenticates anyone and Matrix
  # Authentication Service in front of it needs its own.
  generate:
    # MAS states the form: "This must be a 32-byte long hex-encoded key",
    # from its configuration reference at tag v1.24.0, checked 2026-09-15.
    - name: mas_encryption_secret
      format: hex32
      never_rotate: "it encrypts data already stored, so changing it makes that data unreadable, and Matrix Authentication Service offers no re-encryption the toolkit could drive. An evicted admin who held it also holds a copy of the data it protects, so rotating it would take nothing back"
    # Shared with the homeserver, which carries the same value in
    # matrix_authentication_service.secret. MAS's reference does not say
    # whether Matrix sessions survive it or the signing key changing, and
    # that has not been checked against a running MAS, so both are taken
    # to sign members out, the stricter reading.
    - {name: mas_matrix_secret, rotation_cost: signs-out}
    # "At least one RSA key must be configured", so an RSA key and not one
    # of the elliptic curve types MAS also accepts.
    - {name: mas_signing_key, format: rsa-pem, rotation_cost: signs-out}
  self_rotated: ["mas_signing_key", "mas_matrix_secret"]
# The rules validate holds a homeserver to, by the ids they have always had.
checks:
  # Its media store cannot follow a failover, and the blueprint renders its
  # own Postgres and the hook that creates MAS's database beside it, neither
  # of which exists under cluster placement. A stack pinned for its database
  # and clustered for its app is less available than either, so this is a
  # refusal.
  - id: homeserver-must-be-pinned
    level: refuse
    hint: synapse app must be pinned to a site
    key: placement
    rule: app.placement != 'cluster'
    message: "is cluster, and the synapse blueprint has no clustered form. Its media store cannot follow a failover, because the S3 storage provider supplements a local media directory rather than replacing it, and the blueprint renders its own Postgres plus the hook that creates the authentication service's database beside it. Pin it: placement: { pinned: <site> }."
