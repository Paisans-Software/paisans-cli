# The mbin blueprint, in the core catalog.
# Paisans reads it; internal/blueprints.Parse in paisans-cli documents every key.
apiVersion: paisans.blueprint/v1
name: mbin
services:
  # The paisans fork, not upstream: it carries the generic OIDC
  # provider this blueprint's .env configures, which upstream does not
  # have, and the Doctrine transport decorator the default
  # settings.queue (postgres) needs: on an image without it,
  # MESSENGER_TRANSPORT_DSN=doctrine:// fails every dispatch.
  #
  # A track: Paisans runs the newest of the fork's 1.x releases,
  # published as image tags like 1.15.1-paisans for the release
  # 1.15.1+paisans (linux/amd64 only, so an arm64 apps site cannot run
  # it). This blueprint's templates need four things the fork has carried
  # since 1.15.0+paisans: MBIN_LOCKED_SETTINGS, MBIN_AUTHORIZED_FETCH,
  # MBIN_PRIVATE_INSTANCE read from the environment, and the /healthz
  # route the monitor checks. The newest 1.x always carries them.
  - {name: "app", image: "ghcr.io/paisans-software/mbin:1.*.*-paisans", purpose: "the application, and its messenger consumers"}
  # The three sidecars upstream's compose.yaml runs beside it. The
  # messenger consumers are not here: they run the application's own
  # code, so they always take the app's image, and a key that let them
  # diverge would only be a way to run two versions of one schema.
  #
  # Each is a track on the line upstream's own compose.yaml floats on.
  # RabbitMQ stays on 3.13, the last 3.x series, which upstream still
  # runs: a move to 4.x is a broker upgrade to make deliberately, not a
  # default to drift into.
  - {name: "amqproxy", image: "docker.io/cloudamqp/amqproxy:3.*.*", purpose: "the AMQP connection pool in front of the broker"}
  - {name: "rabbitmq", image: "docker.io/library/rabbitmq:3.13.*-management-alpine", purpose: "the message broker for federation and background work"}
  - {name: "valkey", image: "docker.io/valkey/valkey:9.*.*-trixie", purpose: "the cache"}
  - {name: "postgres", purpose: "its own database, when the app is pinned"}
database: {engine: postgres}
port: 8080
config:
  format: env
  file: ".env"
  # The database settings the .env renders, so the configuration is their
  # only source. The paisans fork reads each one named in
  # MBIN_LOCKED_SETTINGS from the environment on every read, never writes it
  # when an admin saves, shows it disabled, and refuses it through the
  # settings API; a name it cannot lock makes it answer every request with
  # an error, so each must be one the fork lists as lockable.
  locked_settings:
    - KBIN_DOMAIN
    - KBIN_SENDER_EMAIL
    - KBIN_CONTACT_EMAIL
    - MBIN_AUTHORIZED_FETCH
    - {name: MBIN_SSO_ONLY_MODE, when: "app.oidc"}
    - {name: MBIN_PRIVATE_INSTANCE, when: "app.gated"}
    - {name: MBIN_USE_FEDERATION_ALLOW_LIST, when: "app.gated"}
  setting_keys:
    - {key: "MBIN_AUTHORIZED_FETCH", file: ".env", setting: "authorized_fetch"}
    - {key: "OAUTH_OIDC_ADMIN_GROUP", file: ".env", setting: "admin_group"}
    - {key: "OAUTH_OIDC_MEMBER_GROUP", file: ".env", setting: "member_group"}
    - {key: "S3_BUCKET", file: ".env", setting: "s3_bucket"}
    - {key: "S3_REGION", file: ".env", setting: "s3_region"}
# The paisans fork's status-only route, from v1.15.0+paisans: GET or
# HEAD, 200 with an empty body when Postgres and the cache answer, an
# empty 503 when either does not (config/mbin_routes/health.yaml,
# HealthController.php:27-38). Its own firewall has no security
# (security.yaml:34-37), so it answers without a session on a private
# instance too.
health: {path: "/healthz", status: [200]}
# Cited at mbin v1.14.0+paisans (da8b8c34), the tag the pinned image is
# built from.
gate:
  gateable: true
  open_paths:
    # OIDC: /oauth/oidc/connect and its /oauth/oidc/verify callback,
    # which the browser reaches mid-login (security.yaml routes
    # 146-154).
    - "/oauth/*"
    # The native app's OAuth chain, which runs in a WebView with no
    # gate cookie, ending at the sign-in page (league routes.php:9-14,
    # routes 27-39).
    - "/authorize"
    - "/consent"
    - "/token"
    - "/login"
    # Discovery, which a peer needs before it can sign anything:
    # AuthorizedFetchSubscriber::UNGATED_ROUTES
    # (AuthorizedFetchSubscriber.php:52-59, activity_pub.yaml:1-27,
    # 160-164). Webfinger answers JRD, not ActivityPub, so it is not
    # covered by the ActivityPub class.
    - "/.well-known/webfinger"
    - "/.well-known/host-meta"
    - "/.well-known/nodeinfo"
    - "/nodeinfo/*"
    - "/i/actor"
    - "/contexts"
    - "/contexts.jsonld"
    # What the sign-in page loads (webpack.config.js:12,19,
    # base.html.twig:48-59, assets/app.js:9).
    - "/build/*"
    - "/assets/*"
    - "/favicon.ico"
    - "/favicon.svg"
    - "/mbin_logo.svg"
    - "/manifest.json"
    - "/sw.js"
    - "/custom-style"
    # What a native app calls before it holds a token: it registers
    # its own client, then reads what the instance is. Mbin answers
    # these to anyone, private instance or not (security.yaml:143-146
    # at v1.15.0+paisans). Exact paths, not prefixes: the rest of
    # /api/instance/* stays behind the gate.
    #
    # Registering a client grants nothing by itself. A public client
    # still needs /authorize, which needs a member's sign-in. A
    # confidential client_credentials client comes with a bot user
    # (CreateClientApi.php:122-138), created unverified (User.php:188),
    # and the API firewall's user checker refuses an unverified user
    # (security.yaml:27, UserChecker.php:55), so its token reads
    # nothing unless an admin verifies that bot. Anonymous
    # registration is rate limited to two clients per six hours
    # (rate_limiter.yaml:9-12).
    - "/api/client"
    - "/api/info"
    - "/api/instance"
  # The four routes InboxSignatureSubscriber verifies before dispatch
  # (InboxSignatureSubscriber.php:51-56, activity_pub.yaml:35-94).
  inbox_paths: ["/i/inbox", "/f/inbox", "/u/*/inbox", "/m/*/inbox"]
  # A native app reads and writes through /api/* with the token its
  # WebView sign-in earned, and holds no gate session. Safe only
  # because a gated Mbin runs as a private instance
  # (MBIN_PRIVATE_INSTANCE, locked, rendered for every gated Mbin and
  # tested in render's mbin_env_test.go): Mbin's catch-all access rule
  # then refuses any request without a signed in user
  # (security.yaml:152), and /api sits on a stateless OAuth2 firewall
  # that refuses a token it did not issue (security.yaml:22-27). A
  # public Mbin answers /api/* reads with no user at all, so without
  # that mode this path would rest on the firewall alone.
  token_paths: ["/api/*"]
  auto_login:
    - paths: ["/", "/login"]
      # OidcController::connect takes no destination
      # (OidcController.php:14-20).
      target: "/oauth/oidc/connect"
      # The session and remember-me cookies, PHP's and Symfony's
      # defaults (framework.yaml:26-31, security.yaml:59-66).
      absent_cookies: ["PHPSESSID", "REMEMBERME"]
  # The sign-in page Symfony sends an unauthenticated visitor to
  # (security.yaml:90 at v1.15.0+paisans).
  sign_in_path: "/login"
  # A gated Mbin runs as a private instance, so its API refuses a read
  # with no token (internal/blueprints reads private_probe).
  private_probe: {path: "/api/entries", status: [401]}
  # MBIN_AUTHORIZED_FETCH, on unless settings.authorized_fetch turns it
  # off, and MBIN_USE_FEDERATION_ALLOW_LIST when gated, both named in
  # MBIN_LOCKED_SETTINGS, so an admin cannot turn either off. The
  # subscriber gates every ap_* GET route except the instance actor
  # and discovery (AuthorizedFetchSubscriber.php:52-59,83-90 at
  # v1.15.0+paisans). `/` asking for ActivityPub is ap_instance_front
  # (activity_pub.yaml:29), which needs no content and is not in that
  # list, so it answers 401 unsigned (AuthorizedFetchSubscriber.php:
  # 148-153). The monitor proves it all the same: it is what shows the
  # lock holds.
  signed_fetch:
    settings: ["MBIN_AUTHORIZED_FETCH", "MBIN_USE_FEDERATION_ALLOW_LIST"]
    probe: "/"
    status: [401]
  # Each is rendered into its .env and named in MBIN_LOCKED_SETTINGS, which
  # the paisans fork reads from the environment on every read and never
  # from its database (SettingsManager.php:104 at v1.15.1+paisans), so the
  # container's environment is what Mbin enforces.
  settings:
    - name: "MBIN_PRIVATE_INSTANCE"
      want: "true"
      when: "app.gated"
      why: "the gate lets a request with a bearer token reach /api/*, and without private instance mode Mbin answers its API reads with no user at all"
      config_key: "MBIN_PRIVATE_INSTANCE"
    - name: "MBIN_USE_FEDERATION_ALLOW_LIST"
      want: "true"
      when: "app.gated"
      why: "the gate leaves ActivityPub to Mbin, and without the allow list Mbin answers a signed read from any instance"
      config_key: "MBIN_USE_FEDERATION_ALLOW_LIST"
    - name: "MBIN_AUTHORIZED_FETCH"
      want: "true"
      when: "app.gated && app.federates"
      why: "the gate leaves ActivityPub to Mbin, and without authorized fetch Mbin answers an unsigned read"
      config_key: "MBIN_AUTHORIZED_FETCH"
      setting: "authorized_fetch"
  live: {action: env-lock-list, service: app, lock_variable: MBIN_LOCKED_SETTINGS}
federation:
  # Mbin always federates.
  federates: true
# Every blueprint that stores objects serves them on a hostname of its own.
# The set has to agree with UsesObjectStorage, and a test holds it to
# that: a blueprint that stores objects without this role would publish URLs
# nothing routes, and a blueprint with the role and no bucket would route a
# hostname to nothing.
hostname_roles: ["media"]
storage:
  s3: true
  # A federating server fetching an image is a machine with no account
  # here, and a remote instance caches the URL it was given.
  public_reads: true
  # Under /media, served as static files by the web server in its own
  # container (docs/02-admin/01-installation/02-docker.md, "Uploaded media
  # files", at the paisans fork's tag v1.14.0+paisans), and the federated
  # copy of a post points a remote instance there.
  local_media_paths: ["/media/*"]
# Its contact form and the few account mails it still sends, as
# MAILER_DSN and its sender address; settings.contact_email, else the
# sender, is where the contact form sends.
mail: reads
# The paisans fork's generic OIDC provider, read at tag
# v1.13.3+paisans: the callback is oauth_oidc_verify in
# config/mbin_routes/security.yaml, /oauth/oidc/verify; PKCE is on because
# the fork's OidcClient extends KnpU's OAuth2PKCEClient and always
# sends a code challenge (src/Security/Oidc/OidcClient.php:18); and
# OAUTH_OIDC_ADMIN_GROUP and OAUTH_OIDC_MEMBER_GROUP, which the .env
# template renders from these two settings, name the groups it reads
# from the `groups` claim (.env.example_docker:243-273). The groups
# scope is requested only when one of them is set
# (src/Provider/Oidc.php:45-46), which is why both have defaults: an
# empty pair would leave the client unrestricted and the claim
# unread.
oidc:
  callback: "/oauth/oidc/verify"
  pkce: true
  admin_group_setting: "admin_group"
  member_group_setting: "member_group"
  default_admin_group: "admins"
  default_member_group: "members"
  reads_groups: true
  launch_path: "/oauth/oidc/connect"
secrets:
  # The broker, the cache and the Mercure hub each need one, and so do
  # Symfony (APP_SECRET) and Mbin's own OAuth2 server for API clients
  # (OAUTH_PASSPHRASE for its private key, OAUTH_ENCRYPTION_KEY for the
  # tokens it issues). Upstream's .env.example_docker ships a placeholder
  # for each of the last three, and the image bakes those placeholders in,
  # so leaving one unset runs on a value anyone can read in upstream's
  # repository. The OAuth key pair is derived from the passphrase rather
  # than generated on its own.
  generate:
    # The hub and the cache hold no session: sessions are in Postgres.
    - {name: mercure_jwt_secret, rotation_cost: restart}
    # RabbitMQ keeps its accounts in its data directory and reads
    # RABBITMQ_DEFAULT_PASS only on a first start, so the password is
    # changed inside the broker on each site that runs one, before the
    # stack is handed it. rabbitmqctl takes a password only as an argument,
    # so a shell inside the container reads it from stdin and passes it on.
    - name: rabbitmq_password
      rotation_cost: restart
      rotate:
        service: rabbitmq
        when: "has(app.settings.queue) && app.settings.queue == 'rabbitmq'"
        kept: "the app runs its queue in Postgres and starts no RabbitMQ, so no account has this password"
        change: ["sh", "-c", 'IFS= read -r p; exec rabbitmqctl change_password mbin "$p"']
        check: ["sh", "-c", 'IFS= read -r p; exec rabbitmqctl authenticate_user mbin "$p"']
        refused: "Failed to authenticate"
    - {name: valkey_password, rotation_cost: restart}
    # Symfony's framework.secret, which signs the remember me cookie.
    - {name: app_secret, rotation_cost: signs-out}
    # Mbin's OAuth2 server: league's oauth2-server bundle signs access
    # tokens with the private key and encrypts codes and refresh tokens
    # with the encryption key, so all four change together and nothing
    # issued under the old ones verifies after.
    - {name: oauth_passphrase, group: oauth, rotation_cost: signs-out}
    - {name: oauth_encryption_key, group: oauth, rotation_cost: signs-out}
    - {name: oauth_private_key, format: rsa-keypair, passphrase: oauth_passphrase, group: oauth}
    - {name: oauth_public_key, format: rsa-public, of: oauth_private_key, group: oauth}
  self_rotated: ["app_secret", "mercure_jwt_secret", "valkey_password"]
# The rules validate holds an Mbin app to, by the ids they have always had.
checks:
  # Rendering would otherwise have to pick a backend silently.
  - id: mbin-queue-unknown
    level: refuse
    hint: mbin queue setting is not a known value
    key: settings.queue
    rule: |-
      !has(app.settings.queue) || type(app.settings.queue) != string || app.settings.queue in ['', 'postgres', 'rabbitmq']
    message_expr: |-
      'is "' + app.settings.queue + '". Choose postgres (the default: the queues live in the replicated database) or rabbitmq (a broker per site, faster, and lost with its site).'
  # Each site then has its own broker, and an activity a site has
  # acknowledged, or a delivery it has queued, is lost with that site. A
  # warning: a risk an operator may take for throughput.
  - id: mbin-rabbitmq-across-sites
    level: warn
    hint: mbin runs a separate rabbitmq broker on each apps site
    key: settings.queue
    rule: |-
      app.placement != 'cluster' || size(app.sites) < 2 || !has(app.settings.queue) || app.settings.queue != 'rabbitmq'
    message_expr: |-
      "is rabbitmq on " + string(size(app.sites)) + " apps sites. Each site runs its own broker, so work a site has accepted (an inbox delivery already answered, a delivery queued for another server) is lost or stranded with that site. postgres keeps the queues in the replicated database, where the other site's consumers take them over."
  # The toolkit renders authorized_fetch into the app's configuration and
  # locks it there, so a value read as on that the operator meant as off,
  # such as the string "no", would be both wrong and out of reach of the
  # app's admin page.
  - id: authorized-fetch-not-a-boolean
    level: refuse
    hint: authorized_fetch is not true or false
    key: settings.authorized_fetch
    rule: |-
      !has(app.settings.authorized_fetch) || type(app.settings.authorized_fetch) == bool
    message_expr: |-
      'is ' + (type(app.settings.authorized_fetch) == string ? '"' + app.settings.authorized_fetch + '"' : string(app.settings.authorized_fetch)) + '. Write true or false, unquoted, or leave it out for the default, true.'
  # With no mail server Mbin renders Symfony's null transport, so nothing
  # errors and the app works; what is lost is every contact form message
  # and the few account mails it still sends.
  - id: mbin-without-smtp
    level: warn
    hint: mbin has no smtp host, so its mail is discarded
    key: smtp
    rule: has(app.smtp.host)
    message_expr: |-
      'resolves no SMTP host, so ' + app.name + ' renders MAILER_DSN=null://null and discards every mail it sends: contact form messages, and the few account mails it still has (resending an activation link, a password reset). It works otherwise. Declare a top level smtp block, or one on this app.'
  # With no sender Mbin sends as noreply at its own hostname, which dns init
  # says sends no mail unless that hostname is a mail domain.
  - id: mbin-smtp-without-sender
    level: warn
    hint: mbin smtp has no sender
    key_expr: |-
      has(app.own_smtp.from_address) ? 'apps.' + app.name + '.smtp.from_address' : 'smtp.from_address'
    rule: |-
      !has(app.smtp.host) || has(app.smtp.from_address)
    message_expr: |-
      'is not set, so ' + app.name + ' sends as noreply@' + app.hostname + '. dns init publishes that name as sending no mail unless it is a mail domain, so receivers are likely to reject what it sends. Set from_address.'
  # KBIN_SENDER_EMAIL is the From of every mail, and Mbin builds it with
  # Symfony's Address, which throws on anything but an address alone.
  - id: mbin-smtp-from-not-an-email
    level: refuse
    hint: mbin sender is not an email address
    key_expr: |-
      has(app.own_smtp.from_address) ? 'apps.' + app.name + '.smtp.from_address' : 'smtp.from_address'
    rule: |-
      !has(app.smtp.host) || !has(app.smtp.from_address) || isBareEmail(app.smtp.from_address)
    message_expr: |-
      'is "' + app.smtp.from_address + '", which ' + app.name + ' renders as KBIN_SENDER_EMAIL, and Mbin fails to send any mail unless that is an email address alone, Eg: hello@example.org.'
  # Mbin sends every contact form message to it, publishes it in /api/info,
  # and uses it as its Web Push VAPID subject.
  - id: mbin-contact-email-not-an-email
    level: refuse
    hint: mbin contact address is not an email address
    key: settings.contact_email
    rule: |-
      !has(app.settings.contact_email) || (type(app.settings.contact_email) == string && isBareEmail(app.settings.contact_email))
    message_expr: |-
      'is ' + string(app.settings.contact_email) + ', and Mbin sends contact form messages to it, so it must be an email address alone, Eg: admins@example.org. Leave it out to use the sender address.'
