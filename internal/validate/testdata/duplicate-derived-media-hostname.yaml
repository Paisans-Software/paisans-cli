# valid.yaml with one thing broken: auth's hostname is blog-media.example.org,
# which is the media hostname blog derives from its own. Neither line names the
# clash, and Caddy refuses two site blocks for one address.
version: 1
id: f2a9c4e1-0b7d-4c3a-9e2f-5a6b7c8d9e01

community:
  name: "Fixture Community"
  domain: example.org

mesh:
  subnet: 10.44.0.0/24

acme:
  provider: desec

operators:
  alice:
    name: Alice Example
    email: alice@example.org
    keys: |
      ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA alice@example.org
sites:
  home-a:
    roles: [data, apps]
    address: 10.44.0.1
    endpoint: home-a.example.org:51820
    ssh:
      host: home-a.local
      user: ubuntu
      keys: [alice]
  home-b:
    roles: [data, apps]
    address: 10.44.0.2
    ssh:
      host: home-b.local
      user: ubuntu
      keys: [alice]
  vm:
    roles: [gateway, witness]
    address: 10.44.0.3
    endpoint: vm.example.org:51820
    ssh:
      host: vm.example.org
      user: ubuntu
      keys: [alice]

cluster:
  sites: [home-a, home-b]
  port: 5000
  postgres_version: "18"
  synchronous: true
  synchronous_strict: false

etcd:
  members: [home-a, home-b, vm]
  heartbeat_ms: 200
  election_timeout_ms: 2000

storage:
  garage:
    sites: [home-a]
    replication: 1

apps:
  wiki:
    blueprint: wikijs
    hostname: wiki.example.org
    placement: cluster
  blog:
    blueprint: writefreely
    hostname: blog.example.org
    placement: cluster
  auth:
    blueprint: pocket-id
    hostname: blog-media.example.org
    placement: cluster
    settings:
      file_backend: database
