name: release

# A push to main whose version has no tag is a release: this tags it vX.Y.Z
# and publishes the GitHub Release, with the static Linux binaries and their
# SHA256SUMS that `make release-binaries` builds attached to it. A host owner
# downloads one of those to run `paisans site admit` on the host itself.
# Any other push to main is a no-op. The version is the constant in
# internal/version/version.go, which `make bump` sets on develop; the
# "Release X to main" pull request from develop brings it here. Between
# releases develop holds X.Y.Z-dev, which this refuses to release.
#
# That pull request is merged with a merge commit, never squashed or rebased.
# A merge commit keeps main an ancestor of develop, so the next release pull
# request merges without a conflict and develop needs nothing from main.
on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Tags, so the release can tell whether this version was already
          # released and which release came before it.
          fetch-depth: 0

      # A merge to main whose version has no tag is a release, and anything
      # else is a no-op. That needs no label to remember and cannot fire
      # twice for one version.
      - name: Decide whether this is a release
        id: decide
        run: |
          version=$(sed -n 's/^const Version = "\(.*\)"/\1/p' internal/version/version.go)
          test -n "$version" || { echo "no Version in internal/version/version.go"; exit 1; }
          # develop's own version, X.Y.Z-dev, is no release: one reaching
          # main is a release pull request that skipped make bump.
          case "$version" in
            *-*) echo "::error file=internal/version/version.go::main holds ${version}, which is no release. Cut the release on develop with make bump, and merge it to main"; exit 1 ;;
          esac
          tag="v${version}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "${tag} already exists; nothing to release"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Bounded to toolkit release tags, so the notes generator never
          # picks an operator-reconciler-v* tag as the previous release.
          previous=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          {
            echo "release=true"
            echo "version=${version}"
            echo "tag=${tag}"
            echo "previous=${previous}"
          } >> "$GITHUB_OUTPUT"

      - name: Set the commit identity
        if: steps.decide.outputs.release == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      # The changelog section for this version is cut by `make bump`, in the
      # commit that sets Version, so it reaches main through the release pull
      # requests like everything else. main takes pull requests only, so this
      # job cannot commit there. changelog.yml refuses a pull request into
      # main without the section; this checks again, before anything is
      # tagged, in case one arrived some other way.
      - name: Require the changelog section
        if: steps.decide.outputs.release == 'true'
        env:
          VERSION: ${{ steps.decide.outputs.version }}
          KACL_VERSION: "0.7.0"
        run: |
          pipx install "python-kacl==$KACL_VERSION"
          kacl-cli verify
          kacl-cli get "${VERSION}" >/dev/null 2>&1 || {
            echo "::error file=CHANGELOG.md::No ${VERSION} section. Cut it on develop with make bump, and release again."
            exit 1
          }

      # The binaries are built before anything is tagged, so a build that
      # fails leaves no tag and no release behind. make release-binaries is
      # the command a contributor runs locally; the Makefile says why each
      # flag is there.
      - name: Set up Go
        if: steps.decide.outputs.release == 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # COMMIT is what each binary names as its commit in every record it
      # writes, set with -ldflags -X; the check below reads it back.
      - name: Build the Linux binaries
        if: steps.decide.outputs.release == 'true'
        run: make release-binaries COMMIT="${GITHUB_SHA}"

      # QEMU, so the arm64 binary can be run on this amd64 runner.
      - name: Set up QEMU
        if: steps.decide.outputs.release == 'true'
        uses: docker/setup-qemu-action@v4.4.0
        with:
          platforms: arm64

      # Each binary has to report this release's version and this exact
      # commit, without -dirty: anything else means it is not a build of what
      # is being tagged. The runner is linux/amd64, so the amd64 binary runs
      # here directly and the arm64 one runs under QEMU in an alpine container.
      - name: Check the binaries
        if: steps.decide.outputs.release == 'true'
        env:
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          set -euo pipefail
          want="paisans ${VERSION} (${GITHUB_SHA:0:12})"
          got=$(dist/paisans-linux-amd64 version)
          if [ "$got" != "$want" ]; then
            echo "::error::dist/paisans-linux-amd64 version printed '${got}', expected '${want}'"
            exit 1
          fi
          got=$(docker run --rm --platform linux/arm64 -v "$PWD/dist:/d" alpine /d/paisans-linux-arm64 version)
          if [ "$got" != "$want" ]; then
            echo "::error::dist/paisans-linux-arm64 version printed '${got}', expected '${want}'"
            exit 1
          fi
          (cd dist && sha256sum -c SHA256SUMS)

      # From here on a failure leaves the tag pushed, and a re-run releases
      # nothing because the tag exists: delete the draft release if there is
      # one, then the tag, then re-run the job.
      - name: Create and push the tag
        if: steps.decide.outputs.release == 'true'
        env:
          TAG: ${{ steps.decide.outputs.tag }}
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          git tag -a "$TAG" -m "Paisans ${VERSION}"
          git push origin "$TAG"

      # The operator-facing half of the notes: what someone upgrading has to
      # do. The generated half, which lists what changed, is appended by the
      # API call below.
      - name: Read the merged pull request body
        id: pr
        if: steps.decide.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          body=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
            --jq 'first(.[] | select(.merged_at != null) | .body // "") // ""')
          {
            echo "body<<PRBODY_EOF"
            echo "$body"
            echo "PRBODY_EOF"
          } >> "$GITHUB_OUTPUT"

      # Release pull requests carry no change of their own. The notes generator
      # filters by label and by nothing else, so they are labelled here, before
      # the notes are generated below, and dropped by .github/release.yml.
      #
      # Two of them per release: the "Release X" pull request into develop, and
      # the "Release X to main" pull request that this run is the merge of.
      - name: Label the release pull requests
        if: steps.decide.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh label create release --repo "$REPO" --force \
            --color ededed \
            --description 'Release plumbing; excluded from generated release notes'
          {
            gh api "repos/${REPO}/commits/${GITHUB_SHA}/pulls" \
              --jq '.[] | select(.merged_at != null) | .number'
            gh pr list --repo "$REPO" --state merged --limit 20 \
              --json number,headRefName \
              --jq '.[] | select(.headRefName | startswith("release-")) | .number'
          } | sort -u | while read -r pr; do
            gh pr edit "$pr" --repo "$REPO" --add-label release
          done

      # The release is created as a draft, given its binaries, and only then
      # published, so nobody sees a release that is missing them. The REST
      # API takes a hand-written body and the generated list at once,
      # appending the second under the first.
      - name: Create the draft release
        id: release
        if: steps.decide.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.decide.outputs.tag }}
          PREVIOUS: ${{ steps.decide.outputs.previous }}
          BODY: ${{ steps.pr.outputs.body }}
        run: |
          set -euo pipefail
          id=$(gh api "repos/${GITHUB_REPOSITORY}/releases" \
            -f "tag_name=${TAG}" \
            -f "name=${TAG}" \
            -f "body=${BODY}" \
            -F draft=true \
            -F generate_release_notes=true \
            ${PREVIOUS:+-f "previous_tag_name=${PREVIOUS}"} \
            --jq .id)
          echo "id=${id}" >> "$GITHUB_OUTPUT"

      # Uploaded by release id, because the API's lookup of a release by its
      # tag does not return a draft.
      - name: Attach the Linux binaries
        if: steps.decide.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ID: ${{ steps.release.outputs.id }}
        run: |
          set -euo pipefail
          for name in paisans-linux-amd64 paisans-linux-arm64 SHA256SUMS; do
            gh api --method POST \
              -H "Content-Type: application/octet-stream" \
              "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${ID}/assets?name=${name}" \
              --input "dist/${name}" >/dev/null
          done

      - name: Publish the release
        if: steps.decide.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ID: ${{ steps.release.outputs.id }}
        run: |
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${ID}" \
            -F draft=false >/dev/null
